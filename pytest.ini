[pytest]
addopts = -v -s --html=reports/test_report.html --self-contained-html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Smoke test suite covering critical happy paths
    regression: Full regression test suite
    sanity: Quick sanity check tests
    login: Authentication and login tests
    inventory: Catalog, sorting, and inventory tests
    cart: Shopping cart tests
    checkout: Checkout step 1, step 2, and step 3 tests
    e2e: End-to-end user journeys
    sidebar: Sidebar menu navigation and state reset
    security: Security, authorization, and direct URL access tests
    persona: User persona tests (locked out, problem user, glitch user, error user)
